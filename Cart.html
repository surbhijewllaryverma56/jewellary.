<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Jewelry Store</title>
</head>
<style >
/* Cart Section */
.cart-section {
    text-align: center;
    margin-top: 50px;
}

.cart-section p {
    font-size: 1.2rem;
    margin-bottom: 20px;
}

.btn {
    display: inline-block;
    padding: 10px 25px;
    background: #333;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    transition: 0.3s;
}

.btn:hover {
    background: #555;
}
</style>
<body>

    <header>
        <h1>My Shopping Cart</h1>
    </header>

    <section class="cart-section">
        <p>Your cart is currently empty!</p>
        <a href="Product.html" class="btn">Continue Shopping</a>
    </section>

</body>
</html>
