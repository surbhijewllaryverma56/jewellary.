 <!DOCTYPE html>
 <html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jewelry Sign In / Sign Up</title>
 
  <script defer src="script.js"></script>
  
</head>
<style >
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: url('https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=1950&q=80') no-repeat center center/cover;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.auth-container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 20px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
}

.form-box h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #333;
  font-weight: 600;
}

.input-group {
  margin-bottom: 20px;
}

.input-group label {
  display: block;
  margin-bottom: 5px;
  color: #444;
}

.input-group input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 1rem;
}

.btn {
  width: 100%;
  padding: 12px;
  background-color: #d4af37;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.3s ease;
}

.btn:hover {
  background-color: #b99c2d;
}

.toggle-text {
  text-align: center;
  margin-top: 20px;
  font-size: 0.9rem;
  color: #555;
}

.toggle-text a {
  color: #d4af37;
  font-weight: bold;
  text-decoration: none;
}

#signup-only {
  display: none;
}
</style>
<body>
  <div class="auth-container">
    <div class="form-box">
      <h2 id="form-title">Sign In</h2>
      <form id="auth-form">
        <div class="input-group">
          <label>Email</label>
          <input type="email" required />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" required />
        </div>
        <div class="input-group extra" id="signup-only">
          <label>Confirm Password</label>
          <input type="password" />
        </div>
        <button type="submit" class="btn">Continue</button>
      </form>
      <p class="toggle-text">
        Don't have an account?
        <a href="signin.html" id="toggle-form">Sign Up</a>
      </p>
    </div>
  </div>
</body>
</html>
