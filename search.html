<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Jewelry Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
   
</head>
<style>
    /* General Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #f8f8f8;
    color: #333;
    padding: 20px;
}

/* Header */
header {
    text-align: center;
    margin-bottom: 40px;
}

header h1 {
    font-size: 2rem;
    color: #444;
}

/* Search Section */
.search-section {
    display: flex;
    justify-content: center;
    align-items: center;
}

.search-section form {
    display: flex;
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.search-section input {
    flex: 1;
    padding: 12px 20px;
    border: none;
    font-size: 16px;
    outline: none;
}

.search-section button {
    background: #333;
    border: none;
    padding: 12px 20px;
    color: white;
    cursor: pointer;
}

</style>
<body>

    <header>
        <h1>Search Products</h1>
    </header>

    <section class="search-section">
        <form action="#">
            <input type="text" placeholder="Search for jewelry...">
            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
    </section>

</body>
</html>
